<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop Tracker — Work Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --steel-dark:#20262b; --steel:#3a444c; --steel-light:#8a97a1;
    --plate:#e9e6dd; --paper:#f4f2ec;
    --orange:#d9531e; --orange-dark:#b84316;
    --blue:#3a6ea5; --green:#4c8c4a; --amber:#c98a1a; --red:#b3392c;
    --line:#c9c4b6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(0,0,0,0.045) 1px, transparent 0);
    background-size:18px 18px;
    color:var(--steel-dark); font-family:'JetBrains Mono', monospace; min-height:100vh;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px;}

  .plate{
    background:linear-gradient(180deg,#4a555d,#2b3237); border-radius:6px; padding:18px 24px;
    color:var(--plate); display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 3px 0 rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
    position:relative; border:1px solid #1a1f22; flex-wrap:wrap; gap:14px;
  }
  .plate::before, .plate::after{ content:''; position:absolute; width:8px; height:8px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #cfd4d8, #6a747c); top:8px; }
  .plate::before{left:8px;} .plate::after{right:8px;}
  .plate h1{ font-family:'Oswald',sans-serif; font-weight:700; font-size:24px; letter-spacing:1px; margin:0; text-transform:uppercase; }
  .plate .sub{font-size:11px; color:var(--steel-light); letter-spacing:2px; text-transform:uppercase; margin-top:4px;}
  .gauge-mini{display:flex; gap:16px; align-items:center;}
  .gauge{
    width:60px;height:60px;border-radius:50%; background:radial-gradient(circle at 35% 30%, #3d4750, #14181b);
    border:3px solid #55606a; display:flex;align-items:center;justify-content:center;flex-direction:column;
    box-shadow:inset 0 0 8px rgba(0,0,0,0.6);
  }
  .gauge .num{font-family:'Oswald',sans-serif;font-size:19px;font-weight:600;color:var(--orange);}
  .gauge .lbl{font-size:7px;letter-spacing:1px;color:var(--steel-light);text-transform:uppercase;}

  .mainnav{display:flex; gap:6px; margin:20px 0 4px; flex-wrap:wrap;}
  .mainnav .navtab{
    padding:9px 18px; border:1px solid var(--steel-dark); background:transparent; color:var(--steel);
    border-radius:3px 3px 0 0; font-family:'Oswald',sans-serif; font-weight:600; font-size:13px;
    letter-spacing:1px; text-transform:uppercase; cursor:pointer; border-bottom:none;
  }
  .mainnav .navtab.active{ background:var(--steel-dark); color:var(--plate); }
  .view{display:none;} .view.active{display:block;}

  .toolbar{display:flex; justify-content:space-between; align-items:center; margin:18px 0 14px; flex-wrap:wrap; gap:10px;}
  .tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .tab{
    padding:7px 14px; border:1px solid var(--line); background:var(--plate); border-radius:3px;
    font-size:11px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; color:var(--steel);
    font-family:'JetBrains Mono',monospace; font-weight:500;
  }
  .tab.active{background:var(--steel-dark); color:var(--plate); border-color:var(--steel-dark);}
  .btn{
    background:var(--orange); color:#fff; border:none; padding:10px 18px; border-radius:3px;
    font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:0.5px; text-transform:uppercase;
    font-size:13px; cursor:pointer; box-shadow:0 2px 0 var(--orange-dark);
  }
  .btn:active{transform:translateY(1px); box-shadow:0 1px 0 var(--orange-dark);}
  .btn.ghost{background:transparent; color:var(--steel); border:1px solid var(--line); box-shadow:none;}
  .btn.small{padding:6px 10px; font-size:11px;}
  .btn.danger{background:var(--red); box-shadow:0 2px 0 #8a2a20;}

  .search-box{flex:1; min-width:180px; padding:8px 10px; border:1px solid var(--line); border-radius:3px; font-family:'JetBrains Mono',monospace; font-size:12px; background:#fff;}

  .wo{
    background:var(--plate); border:1px solid var(--line); border-left:6px solid var(--steel); border-radius:4px;
    padding:14px 16px; margin-bottom:10px; display:grid; grid-template-columns: 1fr auto auto; gap:12px; align-items:center;
  }
  .wo.status-in{border-left-color:var(--blue);} .wo.status-progress{border-left-color:var(--amber);}
  .wo.status-hold{border-left-color:var(--red);} .wo.status-ready{border-left-color:var(--green);}
  .wo.status-invoiced{border-left-color:var(--steel-light); opacity:0.85;}

  .wo-main .idrow{font-size:10px; color:var(--steel-light); letter-spacing:1px; display:flex; gap:10px; flex-wrap:wrap;}
  .wo-main .cust{font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; margin:3px 0 1px;}
  .wo-main .veh{font-size:12px; color:var(--steel); font-weight:600;}
  .wo-main .desc{font-size:12px; color:var(--steel); line-height:1.4; margin-top:3px;}
  .wo-main .codes{margin-top:6px; display:flex; gap:5px; flex-wrap:wrap;}
  .code-chip{font-size:9px; background:#dedad0; border:1px solid var(--line); border-radius:3px; padding:2px 6px; letter-spacing:0.5px; color:var(--steel);}
  .wo-main .meta{font-size:10px; color:var(--steel-light); margin-top:5px;}

  .status-badge{font-size:10px; letter-spacing:1px; text-transform:uppercase; padding:4px 9px; border-radius:20px; font-weight:600; white-space:nowrap; text-align:center;}
  .status-in .status-badge{background:#dbe8f3; color:var(--blue);}
  .status-progress .status-badge{background:#f3e6c8; color:var(--amber);}
  .status-hold .status-badge{background:#f3d9d5; color:var(--red);}
  .status-ready .status-badge{background:#dcecdb; color:var(--green);}
  .status-invoiced .status-badge{background:#e5e5e5; color:#777;}

  .priority-badge{font-size:9px; letter-spacing:1px; text-transform:uppercase; padding:2px 7px; border-radius:3px; font-weight:700; margin-left:6px;}
  .p-rush{background:var(--red); color:#fff;} .p-normal{background:#ddd8c9; color:var(--steel);}

  .wo-actions{display:flex; flex-direction:column; gap:6px;}
  select.mini{font-family:'JetBrains Mono',monospace; font-size:10px; padding:4px; border-radius:3px; border:1px solid var(--line);}

  .empty{text-align:center; padding:50px 20px; color:var(--steel-light); border:1px dashed var(--line); border-radius:6px; background:var(--plate);}
  .empty .big{font-family:'Oswald',sans-serif; font-size:18px; color:var(--steel); margin-bottom:6px;}

  .overlay{position:fixed; inset:0; background:rgba(20,24,27,0.6); display:flex; align-items:flex-start; justify-content:center; z-index:50; padding:24px 16px; overflow-y:auto;}
  .modal{background:var(--paper); border-radius:8px; padding:24px; width:100%; max-width:660px; border:1px solid var(--line); margin-bottom:40px;}
  .modal h2{font-family:'Oswald',sans-serif; margin-top:0; font-size:20px; text-transform:uppercase; letter-spacing:1px;}
  .section-label{font-family:'Oswald',sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:1.5px; color:var(--orange); margin:20px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--line);}
  .section-label:first-of-type{margin-top:0;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--steel-light); margin-bottom:4px;}
  .field input, .field textarea, .field select{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:4px; font-family:'JetBrains Mono',monospace; font-size:13px; background:#fff;}
  .field textarea{resize:vertical; min-height:60px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .row4{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

  .code-line{background:#fff; border:1px solid var(--line); border-radius:4px; padding:10px; margin-bottom:8px;}
  .code-line-top{display:grid; grid-template-columns:1fr 1fr 24px; gap:8px; align-items:end;}
  .code-line select, .code-line input{padding:7px 8px; font-size:12px;}
  .code-line .notes{margin-top:6px;}
  .code-tag{display:inline-block; font-size:10px; background:var(--steel-dark); color:var(--plate); padding:2px 7px; border-radius:3px; margin-top:5px; letter-spacing:0.5px;}
  .remove-x{cursor:pointer; color:var(--orange); font-weight:700; text-align:center; padding-bottom:8px;}

  .parts-row{display:grid; grid-template-columns:1fr 60px 70px 24px; gap:6px; margin-bottom:6px; align-items:center;}
  .parts-row input{padding:6px 8px; font-size:12px;}
  .total-line{display:flex; justify-content:space-between; padding-top:10px; margin-top:8px; border-top:1px solid var(--line); font-family:'Oswald',sans-serif; font-weight:600; font-size:16px;}

  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px;}
  .card{background:var(--plate); border:1px solid var(--line); border-radius:6px; padding:14px;}
  .card .val{font-family:'Oswald',sans-serif; font-size:26px; font-weight:700; color:var(--orange);}
  .card .lbl{font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--steel-light); margin-top:4px;}
  .report-table{width:100%; border-collapse:collapse; background:var(--plate); border:1px solid var(--line); border-radius:6px; overflow:hidden;}
  .report-table th, .report-table td{text-align:left; padding:9px 12px; font-size:12px; border-bottom:1px solid var(--line);}
  .report-table th{background:var(--steel-dark); color:var(--plate); text-transform:uppercase; letter-spacing:1px; font-size:10px;}
  .report-table tr:last-child td{border-bottom:none;}
  .report-block{margin-bottom:24px;}
  .filter-row{display:flex; gap:10px; align-items:end; margin-bottom:18px; flex-wrap:wrap;}
  .filter-row .field{margin-bottom:0; min-width:150px;}

  .admin-block{background:var(--plate); border:1px solid var(--line); border-radius:6px; padding:18px; margin-bottom:18px;}
  .mech-row{display:flex; gap:8px; align-items:center; margin-bottom:6px;}
  .mech-row span{flex:1; font-size:13px;}

  @media(max-width:600px){
    .wo{grid-template-columns:1fr;} .wo-actions{flex-direction:row; flex-wrap:wrap;}
    .plate{flex-direction:column; align-items:flex-start;}
    .row2,.row3,.row4{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="plate">
    <div>
      <h1>Shop Tracker</h1>
      <div class="sub">Work Orders · Hydraulic Repair Facility</div>
    </div>
    <div class="gauge-mini">
      <div class="gauge"><div class="num" id="gaugeActive">0</div><div class="lbl">Active</div></div>
      <div class="gauge"><div class="num" id="gaugeHold">0</div><div class="lbl">On Hold</div></div>
      <div class="gauge"><div class="num" id="gaugeReady">0</div><div class="lbl">Ready</div></div>
    </div>
  </div>

  <div class="mainnav" id="mainnav">
    <div class="navtab active" data-view="workorders">Work Orders</div>
    <div class="navtab" data-view="reports">Reports</div>
    <div class="navtab" data-view="admin">Admin</div>
  </div>

  <div class="view active" id="view-workorders">
    <div class="toolbar">
      <div class="tabs" id="tabs">
        <div class="tab active" data-filter="all">All</div>
        <div class="tab" data-filter="in">Checked In</div>
        <div class="tab" data-filter="progress">In Progress</div>
        <div class="tab" data-filter="hold">On Hold</div>
        <div class="tab" data-filter="ready">Ready</div>
        <div class="tab" data-filter="invoiced">Invoiced</div>
      </div>
      <button class="btn" id="newJobBtn">+ New Work Order</button>
    </div>
    <input class="search-box" id="searchBox" placeholder="Search WO #, customer, unit #, VIN, plate...">
    <div id="jobList" style="margin-top:14px;"></div>
  </div>

  <div class="view" id="view-reports">
    <div class="filter-row">
      <div class="field"><label>From</label><input type="date" id="rep-from"></div>
      <div class="field"><label>To</label><input type="date" id="rep-to"></div>
      <button class="btn small" id="repApplyBtn">Apply</button>
      <button class="btn small ghost" id="repClearBtn">Clear</button>
    </div>
    <div class="cards" id="repCards"></div>
    <div class="report-block">
      <div class="section-label">Revenue by Month (invoiced)</div>
      <table class="report-table" id="repRevenueTable"></table>
    </div>
    <div class="report-block">
      <div class="section-label">Work Orders by Mechanic</div>
      <table class="report-table" id="repMechTable"></table>
    </div>
    <div class="report-block">
      <div class="section-label">Most Serviced Systems</div>
      <table class="report-table" id="repSystemTable"></table>
    </div>
  </div>

  <div class="view" id="view-admin">
    <div class="admin-block">
      <div class="section-label">Shop Info (appears on invoices)</div>
      <div class="row2">
        <div class="field"><label>Shop Name</label><input id="ad-shopname"></div>
        <div class="field"><label>Phone</label><input id="ad-shopphone"></div>
      </div>
      <div class="field"><label>Address</label><input id="ad-shopaddress"></div>
      <button class="btn small" id="saveShopInfoBtn">Save Shop Info</button>
    </div>

    <div class="admin-block">
      <div class="section-label">Mechanics</div>
      <div id="mechList"></div>
      <div class="row2" style="margin-top:8px;">
        <input id="newMechName" placeholder="Mechanic name">
        <button class="btn small" id="addMechBtn">+ Add Mechanic</button>
      </div>
    </div>

    <div class="admin-block">
      <div class="section-label">Data Management</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn small ghost" id="exportDataBtn">Export All Data (JSON)</button>
        <button class="btn small danger" id="clearDataBtn">Clear All Work Orders</button>
      </div>
    </div>
  </div>

</div>

<div id="modalRoot"></div>

let jobs = [];
let settings = { shopName:'', shopPhone:'', shopAddress:'', mechanics:[] };
let currentFilter = 'all';
let searchTerm = '';
let currentView = 'workorders';
let currentUser = { uid: 'local', email: 'shop' };
let currentUserRole = 'admin';

function uid(){ return Date.now().toString(36).toUpperCase().slice(-6); }
function nextWO(){
  const nums = jobs.map(j => parseInt((j.woNumber||'').replace(/\D/g,''))||0);
  const max = nums.length ? Math.max(...nums) : 1000;
  return 'WO-' + (max+1);
}

let jobsUnsub = null;
let settingsUnsub = null;

function startListeners(){
  const q = query(jobsCol, orderBy('createdAt', 'desc'));
  jobsUnsub = onSnapshot(q, (snap) => {
    jobs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
    if(currentView === 'reports') renderReports();
  }, (err) => {
    console.error('workorders listener error', err);
  });

  settingsUnsub = onSnapshot(settingsDocRef, (snap) => {
    settings = snap.exists() ? { shopName:'', shopPhone:'', shopAddress:'', mechanics:[], ...snap.data() } : settings;
    renderAdmin();
  }, (err) => {
    console.error('settings listener error', err);
  });
}

// Writes a single work order document to Firestore (create or update)
async function persistJob(job){
  try{
    const { id, ...data } = job;
    await setDoc(doc(jobsCol, id), data);
  }catch(e){ console.error('save job failed', e); alert('Could not save to Firebase. Check your connection.'); }
}
async function persistDeleteJob(id){
  try{ await deleteDoc(doc(jobsCol, id)); }
  catch(e){ console.error('delete job failed', e); alert('Could not delete from Firebase. Check your connection.'); }
}
async function saveSettings(){
  try{ await setDoc(settingsDocRef, settings); }
  catch(e){ console.error('save settings failed', e); alert('Could not save to Firebase. Check your connection.'); }
}

function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function partsTotal(j){ return (j.parts||[]).reduce((s,p)=> s + (Number(p.qty)||0)*(Number(p.price)||0), 0); }
function computeTotal(j){ return partsTotal(j) + (Number(j.labor)||0); }

function matchesSearch(j, term){
  if(!term) return true;
  const t = term.toLowerCase();
  const hay = [j.woNumber, j.customer, j.vehicle?.unit, j.vehicle?.vin, j.vehicle?.plate, j.vehicle?.make, j.vehicle?.model]
    .filter(Boolean).join(' ').toLowerCase();
  return hay.includes(t);
}

document.getElementById('mainnav').addEventListener('click', (e)=>{
  const v = e.target.dataset.view;
  if(!v) return;
  currentView = v;
  document.querySelectorAll('.navtab').forEach(t=>t.classList.remove('active'));
  e.target.classList.add('active');
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  if(v==='reports') renderReports();
  if(v==='admin') renderAdmin();
});

function render(){
  const list = document.getElementById('jobList');
  let filtered = currentFilter === 'all' ? jobs : jobs.filter(j => j.status === currentFilter);
  filtered = filtered.filter(j => matchesSearch(j, searchTerm));
  const sorted = [...filtered].sort((a,b) => b.createdAt - a.createdAt);

  if(sorted.length === 0){
    list.innerHTML = `<div class="empty"><div class="big">No work orders here</div>Create a work order to start tracking a repair through the shop.</div>`;
  } else {
    list.innerHTML = sorted.map(j => woCardHtml(j)).join('');
  }

  document.getElementById('gaugeActive').textContent = jobs.filter(j => j.status==='in'||j.status==='progress').length;
  document.getElementById('gaugeHold').textContent = jobs.filter(j => j.status==='hold').length;
  document.getElementById('gaugeReady').textContent = jobs.filter(j => j.status==='ready').length;

  list.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', onCardAction));
  list.querySelectorAll('.status-select').forEach(el => el.addEventListener('change', onStatusChange));
}

function woCardHtml(j){
  const v = j.vehicle || {};
  const vehLine = [v.year, v.make, v.model].filter(Boolean).join(' ') || 'No vehicle info';
  const idBits = [v.unit ? 'Unit '+v.unit : null, v.vin ? 'VIN '+v.vin : null, v.plate ? 'Plate '+v.plate+(v.state?(' ('+v.state+')'):'') : null].filter(Boolean).join(' · ');
  const codes = (j.codeLines||[]).map(c => `<span class="code-chip">${c.code} ${escapeHtml(c.component.replace(c.system,'').trim())}</span>`).join('');
  return `
    <div class="wo status-${j.status}">
      <div class="wo-main">
        <div class="idrow">
          <span>${j.woNumber}</span><span>IN ${j.dateIn || '—'}</span>
          ${j.priority==='rush' ? '<span class="priority-badge p-rush">Rush</span>' : ''}
        </div>
        <div class="cust">${escapeHtml(j.customer)}</div>
        <div class="veh">${escapeHtml(vehLine)}${idBits ? ' — ' + escapeHtml(idBits) : ''}</div>
        <div class="desc">${escapeHtml(j.complaint)}</div>
        ${codes ? `<div class="codes">${codes}</div>` : ''}
        <div class="meta">Parts: $${partsTotal(j).toFixed(2)} · Labor: $${(Number(j.labor)||0).toFixed(2)} · Total: $${computeTotal(j).toFixed(2)}${j.mechanic ? ' · Mechanic: '+escapeHtml(j.mechanic) : ''}</div>
      </div>
      <div class="status-badge">${STATUS_LABELS[j.status]}</div>
      <div class="wo-actions">
        <select class="mini status-select" data-id="${j.id}">
          ${Object.keys(STATUS_LABELS).map(s=>`<option value="${s}" ${s===j.status?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}
        </select>
        <button class="btn small ghost" data-action="edit" data-id="${j.id}">Edit</button>
        <button class="btn small ghost" data-action="invoice" data-id="${j.id}">Invoice</button>
        ${currentUserRole === 'admin' ? `<button class="btn small danger" data-action="delete" data-id="${j.id}">Delete</button>` : ''}
      </div>
    </div>
  `;
}

function onStatusChange(e){
  const id = e.target.dataset.id;
  const job = jobs.find(j=>j.id===id);
  if(job){ job.status = e.target.value; persistJob(job); render(); }
}
function onCardAction(e){
  const id = e.target.dataset.id;
  const action = e.target.dataset.action;
  const job = jobs.find(j=>j.id===id);
  if(action==='delete'){
    if(confirm('Delete this work order? This cannot be undone.')){
      jobs = jobs.filter(j=>j.id!==id); persistDeleteJob(id); render();
    }
  } else if(action==='edit'){ openJobModal(job); }
  else if(action==='invoice'){ openInvoiceModal(job); }
}

document.getElementById('tabs').addEventListener('click', (e)=>{
  if(!e.target.dataset.filter) return;
  currentFilter = e.target.dataset.filter;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  e.target.classList.add('active');
  render();
});
document.getElementById('searchBox').addEventListener('input', (e)=>{ searchTerm = e.target.value; render(); });
document.getElementById('newJobBtn').addEventListener('click', ()=> openJobModal(null));

function systemOptionsHtml(selected){
  return '<option value="">Select system...</option>' + SYSTEM_NAMES.map(s=>`<option value="${escapeHtml(s)}" ${s===selected?'selected':''}>${escapeHtml(s)}</option>`).join('');
}
function componentOptionsHtml(system, selectedCode){
  const list = SYSTEMS[system] || [];
  return '<option value="">Select component...</option>' + list.map(c=>`<option value="${c.code}" ${c.code===selectedCode?'selected':''}>${escapeHtml(c.component.replace(c.system,'').trim() || c.component)} (${c.code})</option>`).join('');
}
function mechanicOptionsHtml(selected){
  const opts = settings.mechanics && settings.mechanics.length ? settings.mechanics : [];
  let html = '<option value="">Unassigned</option>';
  html += opts.map(m=>`<option value="${escapeHtml(m)}" ${m===selected?'selected':''}>${escapeHtml(m)}</option>`).join('');
  if(selected && !opts.includes(selected)) html += `<option value="${escapeHtml(selected)}" selected>${escapeHtml(selected)}</option>`;
  return html;
}

function openJobModal(job){
  const isEdit = !!job;
  const root = document.getElementById('modalRoot');
  const today = new Date().toISOString().slice(0,10);
  const v = (isEdit && job.vehicle) ? job.vehicle : {};
  let codeLines = isEdit ? (job.codeLines||[]).map(c=>({...c})) : [];
  let partsState = isEdit ? (job.parts||[]).map(p=>({...p})) : [];

  root.innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal">
        <h2>${isEdit ? 'Edit ' + job.woNumber : 'New Work Order'}</h2>

        <div class="section-label">Customer &amp; Order Info</div>
        <div class="row2">
          <div class="field"><label>Customer / Company</label><input id="f-customer" value="${isEdit?escapeHtml(job.customer):''}"></div>
          <div class="field"><label>Contact Phone</label><input id="f-phone" value="${isEdit?escapeHtml(job.phone||''):''}"></div>
        </div>
        <div class="row3">
          <div class="field"><label>Date In</label><input type="date" id="f-datein" value="${isEdit?job.dateIn:today}"></div>
          <div class="field"><label>Date Promised</label><input type="date" id="f-datepromised" value="${isEdit?(job.datePromised||''):''}"></div>
          <div class="field"><label>Priority</label>
            <select id="f-priority">
              <option value="normal" ${isEdit&&job.priority==='normal'?'selected':''}>Normal</option>
              <option value="rush" ${isEdit&&job.priority==='rush'?'selected':''}>Rush</option>
            </select>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label>Assigned Mechanic</label><select id="f-mechanic">${mechanicOptionsHtml(isEdit?job.mechanic:'')}</select></div>
          <div class="field"><label>Status</label>
            <select id="f-status">${Object.keys(STATUS_LABELS).map(s=>`<option value="${s}" ${isEdit&&job.status===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}</select>
          </div>
        </div>

        <div class="section-label">Vehicle / Equipment Info</div>
        <div class="row4">
          <div class="field"><label>Unit #</label><input id="v-unit" value="${escapeHtml(v.unit||'')}"></div>
          <div class="field"><label>Year</label><input id="v-year" value="${escapeHtml(v.year||'')}"></div>
          <div class="field"><label>Make</label><input id="v-make" value="${escapeHtml(v.make||'')}"></div>
          <div class="field"><label>Model</label><input id="v-model" value="${escapeHtml(v.model||'')}"></div>
        </div>
        <div class="row3">
          <div class="field"><label>Vehicle/Equipment Type</label><input id="v-type" placeholder="Truck, Trailer, Forklift, Excavator..." value="${escapeHtml(v.type||'')}"></div>
          <div class="field"><label>Color</label><input id="v-color" value="${escapeHtml(v.color||'')}"></div>
          <div class="field"><label>License Plate / State</label><input id="v-plate" value="${escapeHtml(v.plate||'')}"></div>
        </div>
        <div class="row2">
          <div class="field"><label>VIN / Serial #</label><input id="v-vin" value="${escapeHtml(v.vin||'')}"></div>
          <div class="field"><label>Engine Serial #</label><input id="v-engine" value="${escapeHtml(v.engine||'')}"></div>
        </div>
        <div class="row3">
          <div class="field"><label>Odometer (mi)</label><input id="v-odometer" value="${escapeHtml(v.odometer||'')}"></div>
          <div class="field"><label>Engine/Hour Meter Hrs</label><input id="v-hours" value="${escapeHtml(v.hours||'')}"></div>
          <div class="field"><label>Fuel Type</label><input id="v-fuel" value="${escapeHtml(v.fuel||'')}"></div>
        </div>

        <div class="section-label">Reported Issue</div>
        <div class="field"><label>Customer Complaint / Description of Work</label><textarea id="f-complaint">${isEdit?escapeHtml(job.complaint):''}</textarea></div>

        <div class="section-label">System / Component Codes</div>
        <div id="codeLines"></div>
        <button class="btn small ghost" id="addCodeBtn" type="button">+ Add System/Component</button>

        <div class="section-label">Parts &amp; Labor</div>
        <div id="partsRows"></div>
        <button class="btn small ghost" id="addPartBtn" type="button">+ Add Part</button>
        <div class="field" style="margin-top:12px;"><label>Labor ($)</label><input type="number" id="f-labor" value="${isEdit?(job.labor||0):0}" min="0" step="0.01"></div>
        <div class="total-line"><span>Job Total</span><span id="jobTotal">$0.00</span></div>

        <div class="modal-actions">
          <button class="btn ghost" id="cancelBtn">Cancel</button>
          <button class="btn" id="saveBtn">${isEdit?'Save Changes':'Create Work Order'}</button>
        </div>
      </div>
    </div>
  `;

  function renderCodeLines(){
    document.getElementById('codeLines').innerHTML = codeLines.map((cl,i)=>`
      <div class="code-line">
        <div class="code-line-top">
          <div><label style="font-size:9px;color:var(--steel-light);text-transform:uppercase;letter-spacing:1px;">System</label>
            <select data-i="${i}" class="sys-select">${systemOptionsHtml(cl.system)}</select></div>
          <div><label style="font-size:9px;color:var(--steel-light);text-transform:uppercase;letter-spacing:1px;">Component</label>
            <select data-i="${i}" class="comp-select">${cl.system ? componentOptionsHtml(cl.system, cl.code) : '<option value="">Select system first</option>'}</select></div>
          <div class="remove-x" data-i="${i}" data-action="removecode">✕</div>
        </div>
        ${cl.code ? `<span class="code-tag">${cl.code}</span>` : ''}
        <div class="field notes"><input placeholder="Notes (e.g. left cylinder, replaced 2 seals)" data-i="${i}" class="code-notes" value="${escapeHtml(cl.notes||'')}"></div>
      </div>
    `).join('');
    document.querySelectorAll('.sys-select').forEach(sel=>sel.addEventListener('change', (e)=>{
      const i = e.target.dataset.i; codeLines[i].system = e.target.value; codeLines[i].code=''; codeLines[i].component=''; renderCodeLines();
    }));
    document.querySelectorAll('.comp-select').forEach(sel=>sel.addEventListener('change', (e)=>{
      const i = e.target.dataset.i; const code = e.target.value; const entry = CODES.find(c=>c.code===code);
      codeLines[i].code = code; codeLines[i].component = entry?entry.component:''; renderCodeLines();
    }));
    document.querySelectorAll('.code-notes').forEach(inp=>inp.addEventListener('input', (e)=>{ codeLines[e.target.dataset.i].notes = e.target.value; }));
    document.querySelectorAll('[data-action="removecode"]').forEach(x=>x.addEventListener('click', (e)=>{ codeLines.splice(e.target.dataset.i,1); renderCodeLines(); }));
  }
  renderCodeLines();
  document.getElementById('addCodeBtn').onclick = ()=>{ codeLines.push({system:'', code:'', component:'', notes:''}); renderCodeLines(); };

  function renderParts(){
    document.getElementById('partsRows').innerHTML = partsState.map((p,i)=>`
      <div class="parts-row">
        <input placeholder="Part name" data-i="${i}" data-f="name" value="${escapeHtml(p.name)}">
        <input type="number" placeholder="Qty" data-i="${i}" data-f="qty" value="${p.qty}" min="0" step="1">
        <input type="number" placeholder="Price" data-i="${i}" data-f="price" value="${p.price}" min="0" step="0.01">
        <div class="remove-x" data-i="${i}" data-action="removepart">✕</div>
      </div>
    `).join('');
    document.querySelectorAll('.parts-row input').forEach(inp=>inp.addEventListener('input', (e)=>{
      const i=e.target.dataset.i, f=e.target.dataset.f;
      partsState[i][f] = f==='name'?e.target.value:Number(e.target.value);
      updateJobTotal();
    }));
    document.querySelectorAll('[data-action="removepart"]').forEach(x=>x.addEventListener('click',(e)=>{ partsState.splice(e.target.dataset.i,1); renderParts(); updateJobTotal(); }));
  }
  function updateJobTotal(){
    const pt = partsState.reduce((s,p)=>s+(Number(p.qty)||0)*(Number(p.price)||0),0);
    const labor = Number(document.getElementById('f-labor').value)||0;
    document.getElementById('jobTotal').textContent = '$'+(pt+labor).toFixed(2);
  }
  renderParts(); updateJobTotal();
  document.getElementById('addPartBtn').onclick = ()=>{ partsState.push({name:'',qty:1,price:0}); renderParts(); updateJobTotal(); };
  document.getElementById('f-labor').addEventListener('input', updateJobTotal);

  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeModal(); };
  document.getElementById('saveBtn').onclick = ()=>{
    const customer = document.getElementById('f-customer').value.trim();
    if(!customer){ alert('Customer name is required.'); return; }
    const vehicle = {
      unit: document.getElementById('v-unit').value.trim(), year: document.getElementById('v-year').value.trim(),
      make: document.getElementById('v-make').value.trim(), model: document.getElementById('v-model').value.trim(),
      type: document.getElementById('v-type').value.trim(), color: document.getElementById('v-color').value.trim(),
      plate: document.getElementById('v-plate').value.trim(), vin: document.getElementById('v-vin').value.trim(),
      engine: document.getElementById('v-engine').value.trim(), odometer: document.getElementById('v-odometer').value.trim(),
      hours: document.getElementById('v-hours').value.trim(), fuel: document.getElementById('v-fuel').value.trim(),
    };
    const data = {
      customer, phone: document.getElementById('f-phone').value.trim(),
      dateIn: document.getElementById('f-datein').value, datePromised: document.getElementById('f-datepromised').value,
      priority: document.getElementById('f-priority').value, mechanic: document.getElementById('f-mechanic').value,
      status: document.getElementById('f-status').value, vehicle,
      complaint: document.getElementById('f-complaint').value.trim(),
      codeLines: codeLines.filter(c=>c.code),
      parts: partsState.filter(p=>p.name.trim()!==''),
      labor: Number(document.getElementById('f-labor').value)||0,
    };
    let toSave;
    if(isEdit){
      const wasInvoiced = job.status !== 'invoiced' && data.status === 'invoiced';
      Object.assign(job, data);
      if(wasInvoiced) job.invoicedAt = Date.now();
      toSave = job;
    } else {
      toSave = { id: uid(), woNumber: nextWO(), createdAt: Date.now(), ...data };
      jobs.push(toSave);
    }
    persistJob(toSave); render(); closeModal();
  };
}

function openInvoiceModal(job){
  const root = document.getElementById('modalRoot');
  const codesSummary = (job.codeLines||[]).map(c=>`<div>${c.code} — ${escapeHtml(c.component)}${c.notes ? ' ('+escapeHtml(c.notes)+')' : ''}</div>`).join('') || '<div style="color:var(--steel-light);">No system codes logged</div>';
  const partsRows = (job.parts||[]).map(p=>`<tr><td>${escapeHtml(p.name)}</td><td>${p.qty}</td><td>$${Number(p.price).toFixed(2)}</td><td>$${(p.qty*p.price).toFixed(2)}</td></tr>`).join('');
  root.innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal">
        <h2>Invoice — ${job.woNumber}</h2>
        ${settings.shopName ? `<div style="font-size:12px;margin-bottom:8px;"><strong>${escapeHtml(settings.shopName)}</strong><br>${escapeHtml(settings.shopAddress||'')}<br>${escapeHtml(settings.shopPhone||'')}</div>` : ''}
        <div class="section-label">${escapeHtml(job.customer)}</div>
        <div style="font-size:12px;margin-bottom:10px;">${[job.vehicle?.year,job.vehicle?.make,job.vehicle?.model].filter(Boolean).join(' ')} ${job.vehicle?.unit ? '· Unit '+escapeHtml(job.vehicle.unit) : ''}</div>
        <div class="section-label">Systems Serviced</div>
        <div style="font-size:11px; margin-bottom:6px;">${codesSummary}</div>
        <div class="section-label">Parts / Materials</div>
        <table class="report-table"><tr><th>Part</th><th>Qty</th><th>Price</th><th>Line Total</th></tr>${partsRows || '<tr><td colspan="4" style="color:var(--steel-light);">No parts logged</td></tr>'}</table>
        <div class="total-line" style="margin-top:12px;"><span>Labor</span><span>$${(Number(job.labor)||0).toFixed(2)}</span></div>
        <div class="total-line"><span>Total</span><span>$${computeTotal(job).toFixed(2)}</span></div>
        <div class="modal-actions">
          <button class="btn ghost" id="cancelBtn">Close</button>
          <button class="btn" id="markInvoicedBtn">Mark Invoiced</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeModal(); };
  document.getElementById('markInvoicedBtn').onclick = ()=>{
    job.status = 'invoiced';
    job.invoicedAt = Date.now();
    persistJob(job); render(); closeModal();
  };
}

function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

function renderReports(){
  const from = document.getElementById('rep-from').value;
  const to = document.getElementById('rep-to').value;
  let scoped = jobs;
  if(from) scoped = scoped.filter(j => j.dateIn && j.dateIn >= from);
  if(to) scoped = scoped.filter(j => j.dateIn && j.dateIn <= to);

  const invoicedJobs = scoped.filter(j=>j.status==='invoiced');
  const totalRevenue = invoicedJobs.reduce((s,j)=>s+computeTotal(j),0);
  const openJobs = scoped.filter(j=>j.status!=='invoiced');
  const openValue = openJobs.reduce((s,j)=>s+computeTotal(j),0);

  document.getElementById('repCards').innerHTML = `
    <div class="card"><div class="val">${scoped.length}</div><div class="lbl">Total Work Orders</div></div>
    <div class="card"><div class="val">${openJobs.length}</div><div class="lbl">Open Work Orders</div></div>
    <div class="card"><div class="val">${invoicedJobs.length}</div><div class="lbl">Invoiced</div></div>
    <div class="card"><div class="val">$${totalRevenue.toFixed(0)}</div><div class="lbl">Invoiced Revenue</div></div>
    <div class="card"><div class="val">$${openValue.toFixed(0)}</div><div class="lbl">Open Job Value</div></div>
  `;

  const byMonth = {};
  invoicedJobs.forEach(j=>{
    const d = new Date(j.invoicedAt || j.createdAt);
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    byMonth[key] = (byMonth[key]||0) + computeTotal(j);
  });
  const months = Object.keys(byMonth).sort().reverse();
  document.getElementById('repRevenueTable').innerHTML = months.length ?
    '<tr><th>Month</th><th>Revenue</th></tr>' + months.map(m=>`<tr><td>${m}</td><td>$${byMonth[m].toFixed(2)}</td></tr>`).join('')
    : '<tr><td style="color:var(--steel-light);">No invoiced work orders yet</td></tr>';

  const byMech = {};
  scoped.forEach(j=>{
    const m = j.mechanic || 'Unassigned';
    if(!byMech[m]) byMech[m] = {count:0, revenue:0};
    byMech[m].count++;
    if(j.status==='invoiced') byMech[m].revenue += computeTotal(j);
  });
  const mechRows = Object.keys(byMech).sort((a,b)=>byMech[b].count-byMech[a].count);
  document.getElementById('repMechTable').innerHTML = mechRows.length ?
    '<tr><th>Mechanic</th><th>Work Orders</th><th>Invoiced Revenue</th></tr>' + mechRows.map(m=>`<tr><td>${escapeHtml(m)}</td><td>${byMech[m].count}</td><td>$${byMech[m].revenue.toFixed(2)}</td></tr>`).join('')
    : '<tr><td style="color:var(--steel-light);">No data yet</td></tr>';

  const bySystem = {};
  scoped.forEach(j=>(j.codeLines||[]).forEach(cl=>{ bySystem[cl.system] = (bySystem[cl.system]||0)+1; }));
  const sysRows = Object.keys(bySystem).sort((a,b)=>bySystem[b]-bySystem[a]);
  document.getElementById('repSystemTable').innerHTML = sysRows.length ?
    '<tr><th>System</th><th>Times Serviced</th></tr>' + sysRows.map(s=>`<tr><td>${escapeHtml(s)}</td><td>${bySystem[s]}</td></tr>`).join('')
    : '<tr><td style="color:var(--steel-light);">No system codes logged yet</td></tr>';
}
document.getElementById('repApplyBtn').addEventListener('click', renderReports);
document.getElementById('repClearBtn').addEventListener('click', ()=>{
  document.getElementById('rep-from').value=''; document.getElementById('rep-to').value=''; renderReports();
});

function renderAdmin(){
  document.getElementById('ad-shopname').value = settings.shopName || '';
  document.getElementById('ad-shopphone').value = settings.shopPhone || '';
  document.getElementById('ad-shopaddress').value = settings.shopAddress || '';
  const list = document.getElementById('mechList');
  const mechs = settings.mechanics || [];
  list.innerHTML = mechs.length ? mechs.map((m,i)=>`
    <div class="mech-row"><span>${escapeHtml(m)}</span><button class="btn small danger" data-i="${i}" id="rm-${i}">Remove</button></div>
  `).join('') : '<div style="font-size:12px;color:var(--steel-light);">No mechanics added yet</div>';
  mechs.forEach((m,i)=>{
    const btn = document.getElementById('rm-'+i);
    if(btn) btn.addEventListener('click', ()=>{ settings.mechanics.splice(i,1); saveSettings(); renderAdmin(); });
  });
  if(currentUser) renderEmployeeList();
}
document.getElementById('saveShopInfoBtn').addEventListener('click', ()=>{
  settings.shopName = document.getElementById('ad-shopname').value.trim();
  settings.shopPhone = document.getElementById('ad-shopphone').value.trim();
  settings.shopAddress = document.getElementById('ad-shopaddress').value.trim();
  saveSettings();
});
document.getElementById('addMechBtn').addEventListener('click', ()=>{
  const inp = document.getElementById('newMechName');
  const name = inp.value.trim();
  if(!name) return;
  if(!settings.mechanics) settings.mechanics = [];
  settings.mechanics.push(name);
  inp.value = '';
  saveSettings(); renderAdmin();
});
document.getElementById('exportDataBtn').addEventListener('click', ()=>{
  const data = JSON.stringify({ jobs, settings }, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'shop-tracker-export-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('clearDataBtn').addEventListener('click', async ()=>{
  if(confirm('This will permanently delete ALL work orders from Firebase. Are you sure?')){
    const ids = jobs.map(j=>j.id);
    for(const id of ids){ await persistDeleteJob(id); }
    render(); renderReports();
  }
});

startListeners();
</script>
</body>
</html>
